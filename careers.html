<!DOCTYPE html>

<title>Beroepengids — Choose Wise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0;--surface:#fff;--border:#e8e4dc;--border2:#d4cfc4;
  --text:#111;--text2:#555;--text3:#888;
  --gold:#c9a84c;--gold-dark:#a07830;
  --blue:#378ADD;--green:#27500A;--green-bg:#EAF3DE;
  --purple:#7F77DD;--orange:#D85A30;--red:#c00;
  --r:12px;--r-sm:8px;
}
body{font-family:"Georgia",serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px}
.nav-brand{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.nav-back{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--text3);text-decoration:none}
.nav-back:hover{color:var(--text)}
.lang-btn{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600;padding:5px 12px;border:1px solid var(--border2);border-radius:99px;background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.lang-btn:hover{background:var(--bg)}
.lang-btn.nl{background:#AE1C28;color:#fff;border-color:#AE1C28}
.ph{padding:28px 20px 0;max-width:1200px;margin:0 auto}
.ph h1{font-size:clamp(20px,3vw,30px);font-weight:400;margin-bottom:4px}
.ph p{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--text3);margin-bottom:20px}
.ctrl{max-width:1200px;margin:0 auto;padding:0 20px}
.sw{position:relative;margin-bottom:10px}
.sw input{width:100%;padding:10px 14px 10px 38px;font-size:14px;border:1px solid var(--border2);border-radius:var(--r);background:#fff;font-family:"Georgia",serif;outline:none;transition:border-color .15s}
.sw input:focus{border-color:var(--gold)}
.si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.tb{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.sb{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:5px 12px;border:1px solid var(--border2);border-radius:99px;background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.sb:hover{border-color:var(--text3);background:var(--bg)}
.sb.on{background:var(--text);color:#fff;border-color:var(--text)}
.sb-em{border-color:#639922;color:#27500A;background:var(--green-bg)}
.sb-em.on{background:#27500A;color:#fff;border-color:#27500A}
.sb-bm{border-color:var(--gold);color:var(--gold-dark);background:#FDF8EC}
.sb-bm.on{background:var(--gold);color:#fff}
.divider{width:1px;height:18px;background:var(--border2);flex-shrink:0}
.stabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.st{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .12s}
.st:hover{background:var(--bg);border-color:var(--border2)}
.st.on{background:var(--text);color:#fff;border-color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.leg{display:flex;align-items:center;gap:4px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3)}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cnt{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text3);margin-bottom:10px}
.grid{max-width:1200px;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--border2);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card.em{border-left:3px solid #639922}
.card.bookmarked .bm-dot{opacity:1}
.ct-wrap{padding:14px 14px 0;cursor:pointer}
.ct-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:10px}
.ct-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.ct-sec{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.etag{font-size:10px;font-weight:600;background:var(--green-bg);color:#27500A;padding:2px 6px;border-radius:3px;margin-left:5px}
.bm-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .15s}
.bars{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.br{display:flex;align-items:center;gap:7px}
.bl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:var(--text3);width:68px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}
.bt{flex:1;height:5px;background:var(--bg);border-radius:99px;overflow:hidden}
.bf{height:100%;border-radius:99px}
.bv{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:var(--text3);width:20px;text-align:right;flex-shrink:0}
.card-body{padding:12px 14px;border-top:1px solid var(--border)}
.cb-item{margin-bottom:8px}
.cb-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:3px}
.cb-text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);line-height:1.55}
.cb-tags{display:flex;gap:4px;flex-wrap:wrap}
.cb-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--border);color:var(--text3)}
.card-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn-deep{flex:1;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600;padding:8px 12px;border-radius:var(--r-sm);border:none;background:var(--text);color:#fff;cursor:pointer;transition:background .15s;text-align:center}
.btn-deep:hover{background:#333}
.btn-deep.loading{background:#888;cursor:wait}
.btn-deep.loaded{background:var(--gold-dark)}
.btn-yt{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600;padding:8px 12px;border-radius:var(--r-sm);background:var(--red);color:#fff;text-decoration:none;white-space:nowrap;transition:background .15s}
.btn-yt:hover{background:#a00}
.btn-bm{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-bm:hover{background:var(--bg)}
.btn-bm.saved{background:#FDF8EC;border-color:var(--gold);color:var(--gold-dark)}
.deep-panel{padding:14px;border-top:1px solid var(--border);background:var(--bg);display:none}
.deep-panel.open{display:block}
.dp-loading{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--text3);text-align:center;padding:16px 0;display:flex;align-items:center;justify-content:center;gap:8px}
.spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.dp-error{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--red);text-align:center;padding:12px 0}
.ds{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border2)}
.ds:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ds-title{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.ds-icon{font-size:12px}
.fit-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.fit-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:3px 9px;border-radius:99px;background:#E6F1FB;color:#185FA5;border:1px solid #B5D4F4}
.fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.fit-cell{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2);background:#fff;padding:6px 9px;border-radius:var(--r-sm);border:1px solid var(--border)}
.fit-cell strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:2px}
.r-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.r-list li{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);padding-left:14px;position:relative;line-height:1.5}
.r-list li::before{content:"--";position:absolute;left:0;color:var(--text3)}
.r-note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);margin-top:7px;padding:7px 10px;background:#fff;border-radius:var(--r-sm);border:1px solid var(--border);line-height:1.5}
.tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tl-block{background:#fff;border-radius:var(--r-sm);padding:9px;border:1px solid var(--border)}
.tl-period{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:3px}
.tl-sal{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:700;color:#27500A;margin-bottom:3px}
.tl-desc{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2);line-height:1.45}
.w-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.w-block{text-align:center;padding:9px 6px;background:#fff;border-radius:var(--r-sm);border:1px solid var(--border)}
.w-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:3px}
.w-val{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:700;color:var(--text)}
.w-note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);padding:6px 9px;background:#fff;border-radius:var(--r-sm);border:1px solid var(--border)}
.path-rows{display:flex;flex-direction:column;gap:5px}
.path-row{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);line-height:1.5}
.path-row strong{color:var(--text);font-weight:600}
.subj-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.subj-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;padding:2px 8px;border-radius:99px;background:#FDF8EC;color:var(--gold-dark);border:1px solid #F0E4B8}
.adj-list{display:flex;gap:5px;flex-wrap:wrap}
.adj-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;transition:all .12s}
.adj-tag:hover{background:var(--bg);border-color:var(--text3)}
.where-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.where-block{background:#fff;padding:9px;border-radius:var(--r-sm);border:1px solid var(--border)}
.where-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px}
.where-list{list-style:none;display:flex;flex-direction:column;gap:3px}
.where-list li{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2)}
.ai-blocks{display:flex;flex-direction:column;gap:5px}
.ai-block{padding:8px 11px;border-radius:var(--r-sm);font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);line-height:1.5}
.ai-block.cant{background:#FCEBEB;border-left:3px solid #E24B4A}
.ai-block.future{background:#FDF8EC;border-left:3px solid var(--gold)}
.ai-block.augment{background:var(--green-bg);border-left:3px solid #639922}
.ai-block strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:var(--text)}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:5px;counter-reset:steps}
.steps-list li{display:flex;align-items:flex-start;gap:9px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);line-height:1.5;counter-increment:steps}
.steps-list li::before{content:counter(steps);min-width:20px;height:20px;background:var(--text);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.dec-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dec-block{padding:10px;border-radius:var(--r-sm)}
.dec-block.yes{background:var(--green-bg)}
.dec-block.no{background:#FCEBEB}
.dec-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.dec-block.yes .dec-label{color:#27500A}
.dec-block.no .dec-label{color:#791F1F}
.dec-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.dec-list li{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2);line-height:1.45;padding-left:12px;position:relative}
.dec-list li::before{position:absolute;left:0}
.dec-block.yes .dec-list li::before{content:"v"}
.dec-block.no .dec-list li::before{content:"x"}
.video-wrap{display:flex;flex-direction:column;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border2)}
.video-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:4px}
.video-thumb img{width:100%;border-radius:var(--r-sm);display:block;margin-bottom:5px}
.btn-paste{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:5px 10px;border:1px dashed var(--border2);border-radius:var(--r-sm);background:transparent;color:var(--text3);cursor:pointer;width:100%;text-align:center;transition:all .15s}
.btn-paste:hover{border-color:var(--gold);color:var(--gold-dark)}
.video-input-row{display:flex;gap:6px;margin-top:5px}
.video-input{flex:1;font-size:12px;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);outline:none;font-family:"Helvetica Neue",Arial,sans-serif}
.video-input:focus{border-color:var(--gold)}
.btn-save-vid{font-size:12px;padding:6px 12px;background:var(--gold);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;font-weight:600;white-space:nowrap}
.btn-save-vid:hover{background:var(--gold-dark)}
@media(max-width:640px){
  .grid{grid-template-columns:1fr;padding:0 12px 40px}
  .ctrl,.ph{padding-left:12px;padding-right:12px}
  .tl-grid,.w-grid,.dec-grid,.where-grid,.fit-grid{grid-template-columns:1fr}
}
</style>
</head>

function t(k){return TX[lang][k]||TX.en[k]||k;}

function applyLang(){
  var btn=document.getElementById("lang-btn");
  var back=document.getElementById("nav-back");
  var phTitle=document.getElementById("ph-title");
  var phSub=document.getElementById("ph-sub");
  var inp=document.getElementById("search");
  var sl=document.getElementById("sort-label");
  if(btn){btn.textContent=t("btn_toggle");btn.className="lang-btn"+(lang==="nl"?" nl":"");}
  if(back) back.textContent="\u2190 "+t("nav_back");
  if(phTitle) phTitle.textContent=t("title");
  if(phSub) phSub.textContent=t("sub");
  if(inp) inp.placeholder=t("search_ph");
  if(sl) sl.textContent=t("sort");
  var ids={ai:"s_ai",w:"s_w",m:"s_m",imp:"s_imp"};
  Object.keys(ids).forEach(function(k){var b=document.getElementById("s-"+k);if(b)b.textContent=t(ids[k]);});
  var dir=document.getElementById("s-dir");
  if(dir) dir.textContent=(sortDir==="desc"?"\u25bc ":"\u25b2 ")+t(sortDir==="desc"?"dir_hl":"dir_lh");
  var em=document.getElementById("s-em");if(em)em.textContent="\uD83C\uDF31 "+t("em");
  var bm=document.getElementById("s-bm");if(bm)bm.textContent="\u2605 "+t("bm");
  var legs={ai:"leg_ai",w:"leg_w",m:"leg_m",imp:"leg_imp",em:"leg_em"};
  Object.keys(legs).forEach(function(k){var el=document.getElementById("leg-"+k);if(el)el.textContent=t(legs[k]);});
}

function toggleLang(){
  lang=lang==="en"?"nl":"en";
  localStorage.setItem("cw_lang",lang);
  applyLang();
  renderTabs();
  render();
}

function isBookmarked(n){return bookmarks.indexOf(n)>-1;}

function toggleBookmark(idx){
  var n=D[idx].n;
  var i=bookmarks.indexOf(n);
  if(i>-1)bookmarks.splice(i,1);else bookmarks.push(n);
  localStorage.setItem("cw_bm",JSON.stringify(bookmarks));
  render();
}

function renderTabs(){
  var el=document.getElementById("stabs");
  if(!el) return;
  el.innerHTML=sectors.map(function(s){
    var label=s==="All"?t("all"):s;
    return '<button class="st'+(s===activeSector?" on":"")+'" data-sector="'+s.replace(/"/g,"&quot;")+'">'+label+'</button>';
  }).join("");
  el.querySelectorAll(".st").forEach(function(b){
    b.addEventListener("click",function(){activeSector=this.dataset.sector;render();renderTabs();});
  });
}

function setSort(k){
  sortKey=k;
  ["ai","w","m","imp","n"].forEach(function(x){
    var b=document.getElementById("s-"+x);if(b)b.className="sb"+(x===k?" on":"");
  });
  render();
}

function toggleDir(){
  sortDir=sortDir==="desc"?"asc":"desc";
  var btn=document.getElementById("s-dir");
  if(btn) btn.textContent=(sortDir==="desc"?"\u25bc ":"\u25b2 ")+t(sortDir==="desc"?"dir_hl":"dir_lh");
  render();
}

function toggleEmerging(){
  emergingOnly=!emergingOnly;
  var b=document.getElementById("s-em");
  if(b)b.className="sb sb-em"+(emergingOnly?" on":"");
  render();
}

function toggleBookmarksOnly(){
  bookmarksOnly=!bookmarksOnly;
  var b=document.getElementById("s-bm");
  if(b)b.className="sb sb-bm"+(bookmarksOnly?" on":"");
  render();
}

function openDeep(idx){
  var panel=document.getElementById("dp-"+idx);
  if(!panel)return;
  var c=D[idx];
  if(panel.classList.contains("open")){
    panel.classList.remove("open");
    deepOpen[idx]=false;
    var btn=document.getElementById("db-"+idx);
    if(btn){btn.textContent="\uD83D\uDD0D "+t("btn_deep");btn.className="btn-deep";}
    return;
  }
  panel.classList.add("open");
  deepOpen[idx]=true;
  if(deepCache[c.n]){renderDeep(panel,deepCache[c.n],idx);return;}
  var btn=document.getElementById("db-"+idx);
  if(btn){btn.textContent=t("gen");btn.className="btn-deep loading";}
  panel.innerHTML='<div class="dp-loading"><span class="spinner"></span>'+t("gen_for")+' '+c.n+'...</div>';
  fetch("/.netlify/functions/enrich",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({n:c.n,s:c.s,ai:c.ai,w:c.w,m:c.m,imp:c.imp,why:c.why||"",study:c.study||""})
  })
  .then(function(r){return r.json();})
  .then(function(resp){
    if(resp.error){
      panel.innerHTML='<div class="dp-error">'+t("err")+': '+resp.error+'</div>';
      if(btn){btn.textContent="\uD83D\uDD0D "+t("btn_deep");btn.className="btn-deep";}
      return;
    }
    deepCache[c.n]=resp.data;
    try{sessionStorage.setItem("cw_"+c.n,JSON.stringify(resp.data));}catch(e){}
    if(btn){btn.textContent="\u2713 "+t("done");btn.className="btn-deep loaded";}
    renderDeep(panel,resp.data,idx);
    loadVideo(idx);
  })
  .catch(function(){
    panel.innerHTML='<div class="dp-error">'+t("err")+'</div>';
    if(btn){btn.textContent="\uD83D\uDD0D "+t("btn_deep");btn.className="btn-deep";}
  });
}

function loadVideo(idx){
  var c=D[idx];
  fetch("/.netlify/functions/video?career="+encodeURIComponent(c.n))
  .then(function(r){return r.json();})
  .then(function(resp){
    if(resp.video&&resp.video.youtube_url){
      var m=resp.video.youtube_url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]+)/);
      if(m){
        var thumb=document.getElementById("vthumb-"+idx);
        if(thumb) thumb.innerHTML='<div class="video-thumb"><a href="'+resp.video.youtube_url+'" target="_blank" onclick="event.stopPropagation()"><img src="https://img.youtube.com/vi/'+m[1]+'/mqdefault.jpg" alt="Video"></a></div>';
      }
    }
  }).catch(function(){});
}

function showVideoInput(idx){
  var el=document.getElementById("vinput-"+idx);
  if(!el)return;
  if(el.innerHTML){el.innerHTML="";return;}
  var row=document.createElement("div");
  row.className="video-input-row";
  row.onclick=function(e){e.stopPropagation();};
  var inp=document.createElement("input");
  inp.type="text";inp.className="video-input";inp.placeholder="YouTube URL...";inp.id="vi-"+idx;
  var btn=document.createElement("button");
  btn.className="btn-save-vid";btn.textContent=t("save_vid");
  btn.onclick=function(e){e.stopPropagation();saveVideo(idx);};
  row.appendChild(inp);row.appendChild(btn);
  el.appendChild(row);
  inp.focus();
}

function saveVideo(idx){
  var inp=document.getElementById("vi-"+idx);
  if(!inp)return;
  var url=inp.value.trim();
  if(!url){return;}
  inp.disabled=true;
  fetch("/.netlify/functions/video",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({career_name:D[idx].n,youtube_url:url})
  })
  .then(function(r){return r.json();})
  .then(function(resp){
    var el=document.getElementById("vinput-"+idx);
    if(resp.error){if(el)el.innerHTML='<div style="font-size:12px;color:#c00;padding:4px 0">'+resp.error+'</div>';inp.disabled=false;return;}
    if(el)el.innerHTML='<div style="font-size:12px;color:#27500A;padding:4px 0">\u2713 Saved!</div>';
    setTimeout(function(){loadVideo(idx);},800);
  })
  .catch(function(){inp.disabled=false;});
}

function render(){
  var q=(document.getElementById("search").value||"").toLowerCase().trim();
  var list=D.filter(function(c){
    if(activeSector!=="All"&&c.s!==activeSector)return false;
    if(emergingOnly&&!c.em)return false;
    if(bookmarksOnly&&!isBookmarked(c.n))return false;
    if(!q)return true;
    return c.n.toLowerCase().indexOf(q)>-1||c.s.toLowerCase().indexOf(q)>-1||(c.ex&&c.ex.toLowerCase().indexOf(q)>-1);
  });
  if(sortKey==="n")list.sort(function(a,b){var r=a.n.localeCompare(b.n);return sortDir==="asc"?-r:r;});
  else list.sort(function(a,b){return sortDir==="desc"?b[sortKey]-a[sortKey]:a[sortKey]-b[sortKey];});

  var cntEl=document.getElementById("cnt");
  if(cntEl) cntEl.textContent=list.length+" "+(list.length!==1?t("em"):t("em"))+(q?" -- "+q:"");

  var html="";
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var idx=D.indexOf(c);
    var bm=isBookmarked(c.n);
    var ytUrl="https://www.youtube.com/results?search_query=day+in+the+life+"+encodeURIComponent(c.n);
    html+='<div class="card'+(c.em?" em":"")+(bm?" bookmarked":"")+'">'; 
    html+='<div class="ct-wrap" data-cidx="'+idx+'">';
    html+='<div class="ct-head"><div>';
    html+='<div class="ct-name">'+c.n+(c.em?'<span class="etag">New</span>':'')+'</div>';
    html+='<div class="ct-sec">'+c.s+'</div>';
    html+='</div><span class="bm-dot"></span></div>';
    html+='<div class="bars">';
    html+='<div class="br"><span class="bl" id="bl-ai-'+idx+'">'+t("s_ai")+'</span><div class="bt"><div class="bf" style="width:'+c.ai+'%;background:#378ADD"></div></div><span class="bv">'+c.ai+'</span></div>';
    html+='<div class="br"><span class="bl">'+t("s_w")+'</span><div class="bt"><div class="bf" style="width:'+c.w+'%;background:#639922"></div></div><span class="bv">'+c.w+'</span></div>';
    html+='<div class="br"><span class="bl">'+t("s_m")+'</span><div class="bt"><div class="bf" style="width:'+c.m+'%;background:#7F77DD"></div></div><span class="bv">'+c.m+'</span></div>';
    html+='<div class="br"><span class="bl">'+t("s_imp")+'</span><div class="bt"><div class="bf" style="width:'+c.imp+'%;background:#D85A30"></div></div><span class="bv">'+c.imp+'</span></div>';
    html+='</div></div>';
    html+='<div class="card-body">';
    if(c.why) html+='<div class="cb-item"><div class="cb-label">'+t("lbl_why")+'</div><div class="cb-text">'+c.why+'</div></div>';
    if(c.imp_t) html+='<div class="cb-item"><div class="cb-label">'+t("lbl_imp")+'</div><div class="cb-text">'+c.imp_t+'</div></div>';
    if(c.study) html+='<div class="cb-item"><div class="cb-label">'+t("lbl_study")+'</div><div class="cb-text">'+c.study+'</div></div>';
    if(c.ex){
      var exList=c.ex.split(",").map(function(e){return e.trim();});
      html+='<div class="cb-item"><div class="cb-label">'+t("lbl_roles")+'</div><div class="cb-tags">'+exList.map(function(e){return'<span class="cb-tag">'+e+'</span>';}).join("")+'</div></div>';
    }
    html+='</div>';
    html+='<div class="card-foot">';
    html+='<button class="btn-deep" id="db-'+idx+'" data-bidx="'+idx+'">\uD83D\uDD0D '+t("btn_deep")+'</button>';
    html+='<a class="btn-yt" href="'+ytUrl+'" target="_blank" onclick="event.stopPropagation()">&#9654; '+t("btn_watch")+'</a>';
    html+='<button class="btn-bm'+(bm?" saved":"")+'" data-bmidx="'+idx+'">'+(bm?"\u2605 "+t("btn_saved"):"\u2606 "+t("btn_save"))+'</button>';
    html+='</div>';
    html+='<div class="deep-panel" id="dp-'+idx+'"></div>';
    html+='</div>';
  }
  document.getElementById("grid").innerHTML=html;
}

// Event delegation - no inline onclick anywhere
document.addEventListener("click",function(e){
  // Sort buttons
  var sb=e.target.closest("[data-sort]");if(sb){setSort(sb.dataset.sort);return;}
  var dir=e.target.closest("[data-dir]");if(dir){toggleDir();return;}
  var em=e.target.closest("#s-em");if(em){toggleEmerging();return;}
  var bm=e.target.closest("#s-bm");if(bm){toggleBookmarksOnly();return;}
  // Card wrap click (not buttons)
  var cw=e.target.closest(".ct-wrap");
  if(cw&&!e.target.closest("button")&&!e.target.closest("a")){
    var cidx=parseInt(cw.dataset.cidx);if(!isNaN(cidx))openDeep(cidx);
    return;
  }
  // Deep button
  var db=e.target.closest("[data-bidx]");
  if(db&&db.classList.contains("btn-deep")){openDeep(parseInt(db.dataset.bidx));return;}
  // Bookmark button
  var bmb=e.target.closest("[data-bmidx]");
  if(bmb&&bmb.classList.contains("btn-bm")){toggleBookmark(parseInt(bmb.dataset.bmidx));return;}
  // Adjacent tag
  var adj=e.target.closest(".adj-tag");
  if(adj){document.getElementById("search").value=adj.dataset.search||adj.textContent;render();return;}
});

document.getElementById("search").addEventListener("input",function(){render();});

applyLang();
renderTabs();
render();
</script>
