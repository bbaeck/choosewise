<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Encyclopedia — Choose Wise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0;--surface:#ffffff;--border:#e8e4dc;--border2:#d4cfc4;
  --text:#111;--text2:#555;--text3:#888;
  --gold:#c9a84c;--gold-dark:#a07830;
  --blue:#378ADD;--green:#27500A;--green-light:#EAF3DE;
  --purple:#7F77DD;--orange:#D85A30;--red:#c00;
  --radius:12px;--radius-sm:8px;
}
html{scroll-behavior:smooth}
body{font-family:"Georgia",serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── TOP NAV ── */
.topnav{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.topnav-brand{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.topnav-back{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--text3);text-decoration:none}
.topnav-back:hover{color:var(--text)}
.compare-btn{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:6px 14px;border:1px solid var(--border2);border-radius:99px;background:#fff;color:var(--text2);cursor:pointer;transition:all .15s}
.compare-btn:hover{background:var(--bg);border-color:var(--text3)}
.compare-btn.active{background:var(--gold);color:#fff;border-color:var(--gold)}

/* ── PAGE HEADER ── */
.page-header{padding:32px 20px 0;max-width:1200px;margin:0 auto}
.page-header h1{font-size:clamp(22px,3vw,32px);font-weight:400;margin-bottom:6px}
.page-header p{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--text3);margin-bottom:24px}

/* ── CONTROLS ── */
.controls{max-width:1200px;margin:0 auto;padding:0 20px}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;padding:11px 16px 11px 40px;font-size:14px;border:1px solid var(--border2);border-radius:var(--radius);background:#fff;font-family:"Georgia",serif;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tool-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.sb{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:5px 12px;border:1px solid var(--border2);border-radius:99px;background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.sb:hover{border-color:var(--text3);background:var(--bg)}
.sb.on{background:var(--text);color:#fff;border-color:var(--text)}
.sb-em{border-color:#639922;color:#27500A;background:var(--green-light)}
.sb-em.on{background:#27500A;color:#fff;border-color:#27500A}
.sb-bm{border-color:var(--gold);color:var(--gold-dark);background:#FDF8EC}
.sb-bm.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.divider{width:1px;height:20px;background:var(--border2);flex-shrink:0}

.sector-wrap{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.st{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--text3);cursor:pointer;transition:all .12s;white-space:nowrap}
.st:hover{background:var(--bg);border-color:var(--border2)}
.st.on{background:var(--text);color:#fff;border-color:var(--text)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.leg{display:flex;align-items:center;gap:4px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3)}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.cnt{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text3);margin-bottom:12px}

/* ── GRID ── */
.grid{max-width:1200px;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

/* ── CARD ── */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.card:hover{border-color:var(--border2);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card.open{border-color:var(--gold);box-shadow:0 4px 20px rgba(201,168,76,.12)}
.card.emerging{border-left:3px solid #639922}
.card.comparing{border-color:var(--blue);background:#F0F6FF}
.card.bookmarked .bm-dot{opacity:1}

/* card header */
.ch{padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch-left{flex:1}
.ct{font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3}
.cs{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.ch-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.etag{font-size:10px;font-weight:600;background:var(--green-light);color:#27500A;padding:2px 7px;border-radius:4px}
.bm-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .15s;flex-shrink:0}
.tog{font-size:16px;color:var(--text3);line-height:1}
.cmp-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;transition:all .15s}
.comparing .cmp-check{background:var(--blue);border-color:var(--blue)}

/* bars */
.bars{padding:0 16px 12px;display:flex;flex-direction:column;gap:5px}
.br{display:flex;align-items:center;gap:8px}
.bl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:var(--text3);width:52px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}
.bt{flex:1;height:5px;background:var(--bg);border-radius:99px;overflow:hidden}
.bf{height:100%;border-radius:99px;transition:width .4s ease}
.bv{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:var(--text3);width:22px;text-align:right;flex-shrink:0}

/* quick tags */
.qtags{padding:0 16px 14px;display:flex;gap:5px;flex-wrap:wrap}
.qtag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;padding:3px 8px;border-radius:99px;border:1px solid var(--border);color:var(--text3)}

/* ── EXPANDED DETAIL ── */
.det{border-top:1px solid var(--border);padding:0 16px}
.det-loading{padding:20px 0;text-align:center;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--text3)}
.det-loading .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* sections */
.det-section{padding:14px 0;border-bottom:1px solid var(--border)}
.det-section:last-child{border-bottom:none}
.det-title{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.det-title-icon{font-size:12px}

/* fit tags */
.fit-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.fit-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:4px 10px;border-radius:99px;background:#F0F6FF;color:#185FA5;border:1px solid #B5D4F4}
.fit-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.fit-item{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2);background:var(--bg);padding:6px 10px;border-radius:var(--radius-sm)}
.fit-item strong{color:var(--text);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

/* reality */
.reality-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.reality-list li{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);padding-left:16px;position:relative;line-height:1.5}
.reality-list li::before{content:"—";position:absolute;left:0;color:var(--text3)}
.reality-note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-sm);line-height:1.5}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tl-block{background:var(--bg);border-radius:var(--radius-sm);padding:10px}
.tl-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:4px}
.tl-sal{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px}
.tl-desc{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2);line-height:1.45}

/* wealth */
.wealth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.wealth-block{text-align:center;padding:10px 6px;background:var(--bg);border-radius:var(--radius-sm)}
.wealth-block .wl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:4px}
.wealth-block .wv{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:700;color:var(--text)}
.variance-note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text3);padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm)}

/* paths */
.paths-list{display:flex;flex-direction:column;gap:6px}
.path-item{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);line-height:1.5}
.path-item strong{color:var(--text);font-weight:600}
.subject-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.subject-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;padding:3px 8px;border-radius:99px;background:#FDF8EC;color:var(--gold-dark);border:1px solid #F0E4B8}

/* adjacent */
.adj-list{display:flex;gap:5px;flex-wrap:wrap}
.adj-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:5px 10px;border-radius:99px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;transition:all .12s}
.adj-tag:hover{background:var(--bg);border-color:var(--text3)}

/* where */
.where-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.where-block{background:var(--bg);padding:10px;border-radius:var(--radius-sm)}
.where-block .wl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.where-list{list-style:none;display:flex;flex-direction:column;gap:3px}
.where-list li{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2)}

/* ai detail */
.ai-blocks{display:flex;flex-direction:column;gap:6px}
.ai-block{padding:8px 12px;border-radius:var(--radius-sm);font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);line-height:1.5}
.ai-block.cant{background:#FCEBEB;border-left:3px solid #E24B4A}
.ai-block.future{background:#FDF8EC;border-left:3px solid var(--gold)}
.ai-block.augment{background:var(--green-light);border-left:3px solid #639922}
.ai-block strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:var(--text)}

/* steps */
.steps-list{list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:steps}
.steps-list li{display:flex;align-items:flex-start;gap:10px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--text2);line-height:1.5;counter-increment:steps}
.steps-list li::before{content:counter(steps);width:20px;height:20px;background:var(--text);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}

/* decision block */
.decision{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dec-block{padding:12px;border-radius:var(--radius-sm)}
.dec-block.yes{background:var(--green-light)}
.dec-block.no{background:#FCEBEB}
.dec-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.dec-block.yes .dec-label{color:#27500A}
.dec-block.no .dec-label{color:#791F1F}
.dec-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.dec-list li{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--text2);line-height:1.45;padding-left:12px;position:relative}
.dec-list li::before{position:absolute;left:0}
.dec-block.yes .dec-list li::before{content:"✓";color:#27500A}
.dec-block.no .dec-list li::before{content:"✗";color:#791F1F}

/* card footer */
.card-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vlink{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600;color:#fff;background:var(--red);padding:8px 14px;border-radius:var(--radius-sm);text-decoration:none;text-align:center;transition:background .15s}
.vlink:hover{background:#a00}
.vlink.community{background:#111;color:#fff}
.vlink.community:hover{background:#333}
.video-wrap{flex:1;display:flex;flex-direction:column;gap:6px}
.submit-video-btn{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:#fff;color:var(--text2);cursor:pointer;text-align:center}
.submit-video-btn:hover{background:var(--bg)}
.video-input-row{display:flex;gap:6px;margin-top:4px}
.video-input{flex:1;font-size:12px;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);outline:none;font-family:"Helvetica Neue",Arial,sans-serif}
.video-input:focus{border-color:var(--gold)}
.video-submit-btn{font-size:12px;padding:6px 12px;background:var(--gold);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;white-space:nowrap}
.video-submit-btn:hover{background:var(--gold-dark)}
.bm-btn{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:8px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.bm-btn:hover{background:var(--bg)}
.bm-btn.saved{background:#FDF8EC;border-color:var(--gold);color:var(--gold-dark)}
.cmp-btn{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:8px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.cmp-btn:hover{background:var(--bg)}
.cmp-btn.added{background:#F0F6FF;border-color:var(--blue);color:var(--blue)}

/* ── COMPARE PANEL ── */
.compare-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--blue);padding:12px 20px;display:flex;gap:10px;align-items:center;z-index:200;transform:translateY(100%);transition:transform .25s ease}
.compare-panel.visible{transform:translateY(0)}
.cp-slots{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.cp-slot{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:6px 14px;background:var(--bg);border:1px solid var(--border2);border-radius:99px;color:var(--text2);display:flex;align-items:center;gap:6px}
.cp-slot .rm{cursor:pointer;color:var(--text3);font-weight:700}
.cp-slot .rm:hover{color:var(--text)}
.cp-go{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap}
.cp-go:hover{background:#2568b5}
.cp-clear{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;padding:10px;color:var(--text3);background:none;border:none;cursor:pointer}
.cp-clear:hover{color:var(--text)}

/* ── COMPARE VIEW ── */
.compare-view{display:none;max-width:1200px;margin:0 auto;padding:20px}
.compare-view.visible{display:block}
.compare-table{display:grid;gap:1px;background:var(--border)}
.compare-row{display:grid;background:#fff;gap:1px}
.compare-row.header{background:var(--bg)}
.compare-cell{padding:12px 16px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px}
.compare-cell.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);background:var(--bg)}
.compare-cell.career-name{font-size:15px;font-weight:600;color:var(--text)}
.back-to-list{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0 0 16px;display:flex;align-items:center;gap:6px}
.back-to-list:hover{color:var(--text)}

/* ── BOOKMARKS VIEW ── */
.bm-empty{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--text3);text-align:center;padding:40px 20px}

@media(max-width:640px){
  .grid{grid-template-columns:1fr;padding:0 12px 40px}
  .controls{padding:0 12px}
  .page-header{padding:20px 12px 0}
  .timeline,.wealth-grid,.decision,.where-grid,.fit-meta{grid-template-columns:1fr}
  .compare-view{padding:12px}
  .topnav{padding:10px 12px}
}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="topnav-back">&#8592; Home</a>
  <a href="index.html" class="topnav-brand">Choose Wise</a>
  <button class="compare-btn" id="cmp-toggle" onclick="toggleCompareMode()">&#9776; Compare</button>
</nav>

<div id="main-view">
  <div class="page-header">
    <h1>Career Encyclopedia</h1>
    <p id="page-desc">235 careers across 28 sectors &middot; Click any card to expand with AI-powered deep analysis &middot; Compare up to 3 careers</p>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">&#9906;</span>
      <input type="text" id="search" placeholder="Search careers, sectors, example roles..." autocomplete="off">
    </div>
    <div class="toolbar">
      <span class="tool-label">Sort</span>
      <button class="sb on" id="s-ai" data-sort="ai">AI-proof</button>
      <button class="sb" id="s-w" data-sort="w">Wealth</button>
      <button class="sb" id="s-m" data-sort="m">Meaning</button>
      <button class="sb" id="s-imp" data-sort="imp">Impact</button>
      <button class="sb" id="s-n" data-sort="n">A&ndash;Z</button>
      <button class="sb" id="s-dir" data-dir="desc">&#9660; High&rarr;Low</button>
      <div class="divider"></div>
      <button class="sb sb-em" id="s-em">&#127807; Emerging</button>
      <button class="sb sb-bm" id="s-bm">&#9733; Saved</button>
    </div>
    <div class="legend">
      <span class="leg"><span class="ld" style="background:#378ADD"></span>AI-proof</span>
      <span class="leg"><span class="ld" style="background:#639922"></span>Wealth</span>
      <span class="leg"><span class="ld" style="background:#7F77DD"></span>Meaning</span>
      <span class="leg"><span class="ld" style="background:#D85A30"></span>Impact</span>
      <span class="leg"><span class="ld" style="background:#EAF3DE;border:1px solid #639922;border-radius:2px"></span>Emerging</span>
    </div>
    <div class="sector-wrap" id="stabs"></div>
    <div class="cnt" id="cnt"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Compare panel (bottom bar) -->
<div class="compare-panel" id="compare-panel">
  <div class="cp-slots" id="cp-slots"></div>
  <button class="cp-go" onclick="showCompare()">Compare &rarr;</button>
  <button class="cp-clear" onclick="clearCompare()">Clear</button>
</div>

<!-- Compare view -->
<div class="compare-view" id="compare-view">
  <button class="back-to-list" onclick="hideCompare()">&#8592; Back to list</button>
  <div id="compare-table"></div>
</div>

<script>
var D=[

var bookmarks=JSON.parse(localStorage.getItem("cw_bookmarks")||"[]");
var enrichCache={};

// ── RENDER TABS ──
function renderTabs(){
  var el=document.getElementById("stabs");
  el.innerHTML=sectors.map(function(s){
    return'<button class="st'+(s===activeSector?" on":"")+'" data-sector="'+s.replace(/"/g,"&quot;")+'">'+s+'</button>';
  }).join("");
  el.querySelectorAll(".st").forEach(function(b){
    b.addEventListener("click",function(){setSector(this.dataset.sector);});
  });
}

function setSector(s){activeSector=s;openIdx=null;render();renderTabs();}

// ── SORT ──
function setSort(k){
  sortKey=k;openIdx=null;
  ["ai","w","m","imp","n"].forEach(function(x){
    var b=document.getElementById("s-"+x);
    if(b)b.className="sb"+(x===k?" on":"");
  });
  render();
}

var sortDirState="desc";
function toggleDir(){
  sortDirState=sortDirState==="desc"?"asc":"desc";
  var btn=document.getElementById("s-dir");
  if(btn){
    btn.textContent=sortDirState==="desc"?"\u25bc High\u2192Low":"\u25b2 Low\u2192High";
    btn.className="sb"+(sortDirState==="asc"?" on":"");
  }
  openIdx=null;render();
}

function toggleEmerging(){
  emergingOnly=!emergingOnly;
  var b=document.getElementById("s-em");
  if(b)b.className="sb sb-em"+(emergingOnly?" on":"");
  openIdx=null;render();
}

function toggleBookmarksOnly(){
  bookmarksOnly=!bookmarksOnly;
  var b=document.getElementById("s-bm");
  if(b)b.className="sb sb-bm"+(bookmarksOnly?" on":"");
  openIdx=null;render();
}

// ── BOOKMARKS ──
function isBookmarked(n){return bookmarks.indexOf(n)>-1;}
function toggleBookmark(n,e){
  e.stopPropagation();
  var i=bookmarks.indexOf(n);
  if(i>-1)bookmarks.splice(i,1);else bookmarks.push(n);
  localStorage.setItem("cw_bookmarks",JSON.stringify(bookmarks));
  render();
}

// ── COMPARE ──
function toggleCompareMode(){
  compareMode=!compareMode;
  var btn=document.getElementById("cmp-toggle");
  btn.className="compare-btn"+(compareMode?" active":"");
  btn.textContent=compareMode?"\u2715 Done":"\u2630 Compare";
  if(!compareMode){clearCompare();}
  openIdx=null;render();
}

function toggleCompare(n,e){
  e.stopPropagation();
  var i=compareList.indexOf(n);
  if(i>-1){compareList.splice(i,1);}
  else if(compareList.length<3){compareList.push(n);}
  render();renderComparePanel();
}

function renderComparePanel(){
  var panel=document.getElementById("compare-panel");
  var slots=document.getElementById("cp-slots");
  if(compareList.length===0){panel.className="compare-panel";return;}
  panel.className="compare-panel visible";
  slots.innerHTML=compareList.map(function(n,i){
    return'<span class="cp-slot">'+n+'<span class="rm" data-cpi="'+i+'">&times;</span></span>';
  }).join("");
  slots.querySelectorAll('.rm').forEach(function(btn){
    btn.addEventListener('click',function(){
      removeCompare(compareList[parseInt(this.dataset.cpi)]);
    });
  });
}

function removeCompare(n){
  compareList=compareList.filter(function(x){return x!==n;});
  render();renderComparePanel();
}
function clearCompare(){compareList=[];renderComparePanel();render();}

function showCompare(){
  if(compareList.length<2){alert("Pick at least 2 careers to compare.");return;}
  document.getElementById("main-view").style.display="none";
  document.getElementById("compare-panel").className="compare-panel";
  var view=document.getElementById("compare-view");
  view.className="compare-view visible";
  buildCompareTable();
}
function hideCompare(){
  document.getElementById("main-view").style.display="";
  document.getElementById("compare-view").className="compare-view";
}

function buildCompareTable(){
  var careers=compareList.map(function(n){return D.find(function(c){return c.n===n;});}).filter(Boolean);
  var cols=careers.length+1;
  var rows=[
    {label:"Career",fn:function(c){return'<strong>'+c.n+'</strong><br><span style="font-size:11px;color:#888">'+c.s+'</span>';}  },
    {label:"AI-proof",fn:function(c){return bar(c.ai,"#378ADD");}  },
    {label:"Wealth",fn:function(c){return bar(c.w,"#639922");}  },
    {label:"Meaning",fn:function(c){return bar(c.m,"#7F77DD");}  },
    {label:"Impact",fn:function(c){return bar(c.imp,"#D85A30");}  },
    {label:"Why AI won&#39;t replace",fn:function(c){return c.why;}  },
    {label:"How to get there",fn:function(c){return c.study;}  },
    {label:"Example roles",fn:function(c){return c.ex;}  },
    {label:"Impact on world",fn:function(c){return c.imp_t;}  },
  ];
  function bar(v,col){
    return'<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:6px;background:#f0f0f0;border-radius:99px;overflow:hidden"><div style="width:'+v+'%;height:100%;background:'+col+';border-radius:99px"></div></div><span style="font-size:11px;color:#888">'+v+'</span></div>';
  }
  var html='<div class="compare-table" style="grid-template-columns:repeat('+cols+',1fr)">';
  rows.forEach(function(row){
    html+='<div class="compare-row" style="grid-template-columns:repeat('+cols+',1fr)">';
    html+='<div class="compare-cell label">'+row.label+'</div>';
    careers.forEach(function(c){html+='<div class="compare-cell">'+row.fn(c)+'</div>';});
    html+='</div>';
  });
  html+='</div>';
  document.getElementById("compare-table").innerHTML=html;
}

// ── ENRICH ──
function enrich(idx){
  var c=D[idx];
  var key=c.n;
  var container=document.getElementById("det-"+idx);
  if(!container)return;

  // Check browser cache first (sessionStorage)
  var cached=sessionStorage.getItem("cw_"+key);
  if(cached){
    try{
      renderEnriched(container,JSON.parse(cached),c);
      return;
    }catch(e){}
  }

  container.innerHTML='<div class="det-loading"><span class="spinner"></span>Generating deep analysis for '+c.n+'...</div>';

  fetch("/.netlify/functions/enrich",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({n:c.n,s:c.s,ai:c.ai,w:c.w,m:c.m,imp:c.imp,why:c.why||"",study:c.study||""})
  })
  .then(function(r){return r.json();})
  .then(function(resp){
    if(resp.error){
      if(document.getElementById("det-"+idx)){
        document.getElementById("det-"+idx).innerHTML='<div class="det-loading" style="color:#c00">Could not load analysis: '+resp.error+'</div>';
      }
      return;
    }
    var data=resp.data;
    // Cache in sessionStorage so re-opens are instant
    try{sessionStorage.setItem("cw_"+key,JSON.stringify(data));}catch(e){}
    enrichCache[key]=data;
    if(document.getElementById("det-"+idx)){
      renderEnriched(document.getElementById("det-"+idx),data,c);
    }
  })
  .catch(function(err){
    if(document.getElementById("det-"+idx)){
      document.getElementById("det-"+idx).innerHTML='<div class="det-loading" style="color:#c00">Could not load deep analysis. Check your connection.</div>';
    }
  });
}

// ── RENDER ──
function render(){
  var q=(document.getElementById("search").value||"").toLowerCase().trim();
  var list=D.filter(function(c){
    if(activeSector!=="All"&&c.s!==activeSector)return false;
    if(emergingOnly&&!c.em)return false;
    if(bookmarksOnly&&!isBookmarked(c.n))return false;
    if(!q)return true;
    return c.n.toLowerCase().indexOf(q)>-1||c.s.toLowerCase().indexOf(q)>-1||c.ex.toLowerCase().indexOf(q)>-1;
  });

  if(sortKey==="n"){
    list.sort(function(a,b){var r=a.n.localeCompare(b.n);return sortDirState==="asc"?-r:r;});
  }else{
    list.sort(function(a,b){return sortDirState==="desc"?b[sortKey]-a[sortKey]:a[sortKey]-b[sortKey];});
  }

  document.getElementById("cnt").textContent=list.length+" career"+(list.length!==1?"s":"")+(q?' matching "'+q+'"':"");

  var html="";
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var idx=D.indexOf(c);
    var open=openIdx===idx;
    var bm=isBookmarked(c.n);
    var inCmp=compareList.indexOf(c.n)>-1;
    html+='<div class="card'+(open?" open":"")+(c.em?" emerging":"")+(bm?" bookmarked":"")+(inCmp&&compareMode?" comparing":"")+'" data-idx="'+idx+'">';
    html+='<div class="ch"><div class="ch-left">';
    html+='<div class="ct">'+c.n+(c.em?'<span class="etag" style="margin-left:6px">New</span>':'')+'</div>';
    html+='<div class="cs">'+c.s+'</div>';
    html+='</div><div class="ch-right">';
    if(compareMode){html+='<div class="cmp-check">'+(inCmp?"&#10003;":"")+'</div>';}
    html+='<span class="bm-dot"></span>';
    html+='<span class="tog">'+(open?"&#8722;":"&#43;")+'</span>';
    html+='</div></div>';

    // Bars
    html+='<div class="bars">';
    html+='<div class="br"><span class="bl">AI-proof</span><div class="bt"><div class="bf" style="width:'+c.ai+'%;background:#378ADD"></div></div><span class="bv">'+c.ai+'</span></div>';
    html+='<div class="br"><span class="bl">Wealth</span><div class="bt"><div class="bf" style="width:'+c.w+'%;background:#639922"></div></div><span class="bv">'+c.w+'</span></div>';
    html+='<div class="br"><span class="bl">Meaning</span><div class="bt"><div class="bf" style="width:'+c.m+'%;background:#7F77DD"></div></div><span class="bv">'+c.m+'</span></div>';
    html+='<div class="br"><span class="bl">Impact</span><div class="bt"><div class="bf" style="width:'+c.imp+'%;background:#D85A30"></div></div><span class="bv">'+c.imp+'</span></div>';
    html+='</div>';

    // Open detail
    if(open){
      var ytUrl="https://www.youtube.com/results?search_query=day+in+the+life+"+encodeURIComponent(c.n);
      var bmClass="bm-btn"+(bm?" saved":"");
      var bmLabel=bm?"&#9733; Saved":"&#9733; Save";
      html+='<div class="det" id="det-'+idx+'"><div class="det-loading"><span class="spinner"></span>Generating deep analysis...</div></div>';
      html+='<div class="card-footer">';
      html+='<div class="video-wrap" id="vwrap-'+idx+'">';
      html+='<a class="vlink" id="vlink-'+idx+'" href="'+ytUrl+'" target="_blank" onclick="event.stopPropagation()">&#9654; Day in the life on YouTube</a>';
      html+='</div>';
      html+='<button class="'+bmClass+'" data-bm="'+idx+'" onclick="event.stopPropagation();bmClick('+idx+')">'+bmLabel+'</button>';
      if(compareMode){
        var cmpClass="cmp-btn"+(inCmp?" added":"");
        var cmpLabel=inCmp?"&#10003; Added":"&#43; Compare";
        html+='<button class="'+cmpClass+'" data-cmp="'+idx+'" onclick="event.stopPropagation();cmpClick('+idx+')">'+cmpLabel+'</button>';
      }
      html+='</div>';
    }

    html+='</div>';
  }
  document.getElementById("grid").innerHTML=html;

  // Trigger enrichment after render
  if(openIdx!==null){
    setTimeout(function(){enrich(openIdx);},50);
    setTimeout(function(){loadVideo(openIdx);},100);
  }
}

function toggle(idx){
  openIdx=openIdx===idx?null:idx;
  render();
}

function searchFor(term){
  document.getElementById("search").value=term;
  openIdx=null;
  render();
}

// ── VIDEO FUNCTIONS ──
function loadVideo(idx){
  var c=D[idx];
  fetch("/.netlify/functions/video?career="+encodeURIComponent(c.n))
  .then(function(r){return r.json();})
  .then(function(resp){
    if(resp.video && resp.video.youtube_url){
      var wrap=document.getElementById("vwrap-"+idx);
      if(!wrap)return;
      var videoId=resp.video.youtube_url.match(/(?:v=|youtu\.be\/)([\w-]+)/);
      if(videoId){
        wrap.innerHTML=
          '<a class="vlink community" href="'+resp.video.youtube_url+'" target="_blank" onclick="event.stopPropagation()">'+
          '<img src="https://img.youtube.com/vi/'+videoId[1]+'/mqdefault.jpg" style="width:100%;border-radius:6px;display:block;margin-bottom:6px">'+
          '&#9654; Community pick &mdash; Watch on YouTube</a>'+
          '<button class="submit-video-btn" data-idx="'+idx+'" onclick="event.stopPropagation();showVideoInput('+idx+')">&#128279; Suggest a better video</button>';
      }
    } else {
      var wrap=document.getElementById("vwrap-"+idx);
      if(wrap){
        var existing=wrap.querySelector(".vlink");
        if(existing){
          var btn=document.createElement("button");
          btn.className="submit-video-btn";
          btn.dataset.idx=idx;
          btn.setAttribute("onclick","event.stopPropagation();showVideoInput("+idx+")");
          btn.textContent="&#128279; Paste a better YouTube video";
          wrap.appendChild(btn);
        }
      }
    }
  })
  .catch(function(){});
}

function showVideoInput(idx){
  var wrap=document.getElementById("vwrap-"+idx);
  if(!wrap)return;
  var existing=wrap.querySelector(".video-input-row");
  if(existing){existing.remove();return;}
  var row=document.createElement("div");
  row.className="video-input-row";
  row.onclick=function(e){e.stopPropagation();};
  row.innerHTML='<input type="text" class="video-input" placeholder="Paste YouTube URL here..." />'+
    '<button class="video-submit-btn" onclick="event.stopPropagation();submitVideo('+idx+')">Save</button>';
  wrap.appendChild(row);
  row.querySelector("input").focus();
}

function submitVideo(idx){
  var wrap=document.getElementById("vwrap-"+idx);
  if(!wrap)return;
  var input=wrap.querySelector(".video-input");
  if(!input)return;
  var url=input.value.trim();
  if(!url){alert("Please paste a YouTube URL");return;}
  var c=D[idx];
  input.disabled=true;
  fetch("/.netlify/functions/video",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({career_name:c.n,youtube_url:url})
  })
  .then(function(r){return r.json();})
  .then(function(resp){
    if(resp.error){alert("Error: "+resp.error);input.disabled=false;return;}
    // Reload the video section
    wrap.innerHTML='<div class="det-loading" style="color:#27500A">&#10003; Video saved! Reloading...</div>';
    setTimeout(function(){loadVideo(idx);},800);
  })
  .catch(function(e){alert("Could not save video. Try again.");input.disabled=false;});
}

// ── CLICK HELPERS (avoid inline quote issues) ──
function bmClick(idx){ toggleBookmark(D[idx].n, {stopPropagation:function(){}}); }
function cmpClick(idx){ toggleCompare(D[idx].n, {stopPropagation:function(){}}); }

// ── EVENT LISTENERS ──
document.getElementById("search").addEventListener("input",function(){openIdx=null;render();});

document.querySelector(".toolbar").addEventListener("click",function(e){
  var s=e.target.closest("[data-sort]");if(s){setSort(s.dataset.sort);return;}
  var d=e.target.closest("[data-dir]");if(d){toggleDir();return;}
  var em=e.target.closest("#s-em");if(em){toggleEmerging();return;}
  var bm=e.target.closest("#s-bm");if(bm){toggleBookmarksOnly();return;}
});

document.getElementById("stabs").addEventListener("click",function(e){
  var b=e.target.closest(".st");if(b)setSector(b.dataset.sector);
});

document.getElementById("grid").addEventListener("click",function(e){
  if(e.target.tagName==="A"||e.target.closest("a"))return;
  if(e.target.closest("button"))return;
  var adj=e.target.closest(".adj-tag");
  if(adj){searchFor(adj.dataset.search||adj.textContent);return;}
  var card=e.target.closest(".card");
  if(!card)return;
  var idx=parseInt(card.dataset.idx);
  if(!isNaN(idx)){
    if(compareMode){toggleCompare(D[idx].n,e);}
    else{toggle(idx);}
  }
});

renderTabs();
render();
</script>
